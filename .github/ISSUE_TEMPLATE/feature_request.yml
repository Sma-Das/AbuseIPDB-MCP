name: Feature request
description: Suggest an improvement to the MCP service.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What security workflow or MCP interaction should improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include API, tool-schema, safety, or compatibility considerations.
    validations:
      required: true

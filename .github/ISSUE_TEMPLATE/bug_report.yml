name: Bug report
description: Report a reproducible problem without sharing credentials or personal data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include an AbuseIPDB API key, bearer token, personal data, or raw production logs. Report vulnerabilities privately according to SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [stdio, Streamable HTTP, both, not applicable]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include sanitized reproduction steps, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go or Docker version, and MCP client.
